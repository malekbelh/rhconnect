# === Spring Boot ===
spring.application.name=rhconnect-backend
server.port=8080

# === HTTPS / SSL Configuration ===
# Décommenter et configurer en production
# server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeme}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat
# Forcer HTTPS
# server.http2.enabled=true

# === Security Headers ===
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# === MongoDB ===
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/rhconnect}
spring.data.mongodb.database=rhconnect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# === Jackson (dates en ISO-8601 string) ===
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# === JWT Configuration ===
rhconnect.jwt.secret=${JWT_SECRET}
rhconnect.jwt.access-token-ttl-seconds=${ACCESS_TTL:900}
rhconnect.jwt.refresh-token-ttl-seconds=${REFRESH_TTL:604800}

# === Password Reset ===
rhconnect.password.reset.token-ttl-minutes=${RESET_TOKEN_TTL:30}
rhconnect.app.base-url=${APP_BASE_URL:http://localhost:5173}

# === Email Configuration (SMTP) ===
# Gmail SMTP - utiliser un "Mot de passe d'application" (pas le mot de passe du compte)
# Créer sur: https://myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Nom affiché dans l'email
app.mail.from-name=RhConnect

# === Ollama / AI ===
rhconnect.ai.provider=${AI_PROVIDER:ollama}
rhconnect.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
rhconnect.ai.ollama.model=${OLLAMA_MODEL:llama3.1:latest}
rhconnect.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT:120}

# === Seed ===
rhconnect.seed.force=${SEED_FORCE:false}

# === Logging ===
logging.level.com.rhconnect=INFO
logging.level.org.springframework.security=WARN

# === Springdoc OpenAPI / Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.rhconnect.controller
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
